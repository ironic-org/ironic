[package]
name = "microservices-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ironic = { path = "../..", features = ["grpc", "transport-kafka", "microservices", "events", "openapi"] }
tonic = "0.14"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing-subscriber = "0.3"
kafka = "0.10"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
tonic-build = "0.14"

[[bin]]
name = "service-a"
path = "src/service_a.rs"

[[bin]]
name = "service-b"
path = "src/service_b.rs"
